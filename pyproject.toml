[build-system]
    requires = ["setuptools", "wheel"]
    build-backend = "setuptools.build_meta"

[project]
    name = "polyphys"
    description = "Computer Simulation Data Management and Analysis."
    authors = [{ name="Amir Sadeghi" }]
    readme = "README.md"
    license = "MIT"
    classifiers = [
        "Intended Audience :: Science/Research",
        "Topic :: Scientific/Engineering :: Physics",
        "Topic :: Scientific/Engineering :: Chemistry",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14"
    ]
    dynamic = ["version"]
    requires-python = ">=3.11"
    dependencies = [
        "numpy>=2.0",
        "pandas>=3.0",
        "scipy>=1.14.1"
    ]

[project.optional-dependencies]
    docs = [
        "sphinx",
        "sphinx_sitemap",
        "pydata-sphinx-theme",
        "sphinx-autodoc-typehints",
        "myst-parser"
    ]
    dev = [
        "pytest",
        "pytest-cov",
        "hypothesis",
        "flake8",
        "mypy",
        "pandas-stubs",
        "scipy-stubs",
        "build"
    ]
    mda = [
        "MDAnalysis>=2.8"
    ]
    viz = [
        "matplotlib>=3.8.4"
    ]

[project.urls]
    Documentation = "https://polyphys.readthedocs.io/en/latest/"
    Source = "https://github.com/amirhs1/PolyPhys"
    Issues = "https://github.com/amirhs1/PolyPhys/issues"

[tool.setuptools]
    include-package-data = true

[tool.setuptools.dynamic]
    version = {attr = "polyphys.__version__.__version__"}

[tool.setuptools.packages.find]
    include = ["polyphys*"]
    exclude = ["projects*", "under_review*"]

[tool.pytest.ini_options]
    addopts = """\
        --doctest-modules --doctest-glob=README.md \
        -ra --strict-markers --strict-config --import-mode=importlib \
        -p pytester"""
    testpaths = ["polyphys/tests"]
    xfail_strict = true

[tool.coverage.run]
    # Scripts for hand-run checks, such as make_starts.py, are not code
    # under test.
    omit = ["polyphys/tests/data/*"]

[tool.mypy]
    files = [
        "polyphys/analyze",
        "polyphys/manage",
        "polyphys/probe",
        "polyphys/simulate",
        "polyphys/viz",
        "projects",
    ]
    strict = true

[[tool.mypy.overrides]]
    # MDAnalysis ships no py.typed marker and no stubs, so its names are Any.
    module = ["MDAnalysis", "MDAnalysis.*"]
    ignore_missing_imports = true

[[tool.mypy.overrides]]
    # The probe analyses subclass MDAnalysis's AnalysisBase, which is Any.
    module = ["polyphys.probe.*"]
    disallow_subclassing_any = false
