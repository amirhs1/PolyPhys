[build-system]
    requires = ["setuptools", "wheel"]
    build-backend = "setuptools.build_meta"

[project]
    name = "polyphys"
    description = "Computer Simulation Data Management and Analysis."
    authors = [{ name="Amir Sadeghi" }]
    readme = "README.md"
    license = "MIT"
    classifiers = [
        "Intended Audience :: Science/Research",
        "Topic :: Scientific/Engineering :: Physics",
        "Topic :: Scientific/Engineering :: Chemistry",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13"
    ]
    dynamic = ["version"]
    requires-python = ">=3.11"
    dependencies = [
        "numpy",
        "pandas"
    ]

[project.optional-dependencies]
    docs = [
        "sphinx",
        "sphinx_sitemap",
        "pydata-sphinx-theme",
        "sphinx-autodoc-typehints",
        "myst-parser"
    ]
    dev = [
        "pytest",
        "pytest-cov",
        "flake8",
        "mypy",
        "pandas-stubs",
        "build"
    ]

[project.urls]
    Documentation = "https://polyphys.readthedocs.io/en/latest/"
    Source = "https://github.com/amirhs1/PolyPhys"
    Issues = "https://github.com/amirhs1/PolyPhys/issues"

[tool.setuptools]
    include-package-data = true

[tool.setuptools.dynamic]
    version = {attr = "polyphys.__version__.__version__"}

[tool.setuptools.packages.find]
    include = ["polyphys*"]
    exclude = ["projects*", "under_review*"]

[tool.pytest.ini_options]
    addopts = """\
        --doctest-modules --doctest-glob=README.md \
        -ra --strict-markers --strict-config --import-mode=importlib \
        -p pytester"""
    testpaths = ["polyphys/tests"]
    xfail_strict = true

[tool.mypy]
    files = ["polyphys/analyze", "polyphys/manage"]
    strict = true
