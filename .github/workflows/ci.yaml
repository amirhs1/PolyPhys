name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8

      - name: Run flake8
        run: flake8 polyphys projects

  typecheck:
    name: Type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run mypy
        run: mypy polyphys/analyze polyphys/manage polyphys/probe polyphys/simulate projects

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with dev and viz dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,viz]

      - name: Run tests with coverage
        # --cov-fail-under fails the job when total coverage drops below the
        # floor. coverage.py rounds the total to whole percent before the
        # comparison, so keep the floor a whole number. These jobs have no
        # MDAnalysis, so .coveragerc-no-mda leaves the probe layer and its
        # tests, which cannot run here, out of the measured set; the
        # MDAnalysis job below measures them.
        run: |
          pytest polyphys README.md projects \
            --cov=polyphys \
            --cov-config=.coveragerc-no-mda \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95 \
            --doctest-modules \
            --doctest-glob="README.md"

      - name: Upload coverage XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  test-mda:
    name: Test with MDAnalysis, Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project with dev, mda, and viz dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,mda,viz]

      - name: Run tests with coverage
        # The probe layer needs MDAnalysis, so only this job runs its tests
        # and doctests and measures their coverage. Codecov merges this
        # report with the matrix jobs', which leave the probe layer out; the
        # floor stays on the matrix job.
        run: |
          pytest polyphys README.md projects \
            --cov=polyphys \
            --cov-report=term-missing \
            --cov-report=xml \
            --doctest-modules \
            --doctest-glob="README.md"

      - name: Upload coverage XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-3.14-mda
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  test-lowest:
    name: Test lowest dependencies, Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install project at its lowest allowed dependencies
        # --resolution lowest-direct installs the lowest version that
        # pyproject.toml allows of each direct dependency: numpy, pandas,
        # scipy, and the viz extra's matplotlib. The test tools are not
        # floors under test, so the second install takes their latest
        # versions and leaves the resolved floors in place.
        run: |
          uv venv --python python .venv
          uv pip install --python .venv/bin/python \
            --resolution lowest-direct --only-binary :all: -e .[viz]
          uv pip install --python .venv/bin/python pytest hypothesis
          uv pip list --python .venv/bin/python

      - name: Run tests
        # Without MDAnalysis, like the matrix jobs, and without coverage:
        # this job checks the floors, and it uploads no coverage report.
        run: |
          .venv/bin/python -m pytest polyphys README.md projects \
            --doctest-modules \
            --doctest-glob="README.md"

  docs:
    name: Build docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project with docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[docs]

      - name: Build HTML documentation
        # -W turns Sphinx warnings into errors so broken cross-references,
        # malformed docstring markup, and missing API stubs fail the build.
        run: python -m sphinx -W -b html docs/source docs/_build

  build:
    name: Build package
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build
