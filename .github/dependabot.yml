version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Commit, branch, and labels as CONTRIBUTING.md, "Names", sets them.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    pull-request-branch-name:
      prefix: "chore"
    # Declared explicitly: without this key Dependabot recreates its default
    # `dependencies` label.
    labels:
      - "type:chore"
      - "area:deps"
    groups:
      github-actions:
        patterns:
          - "*"
